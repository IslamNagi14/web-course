<html>

<body>
    <h4>Add and Manage your daily tasks</h4>
    <hr>

    <h1>Add new task</h1>

    <form action="#" method="get" target="_self">

        <label for="taskname">Task Name</label>
        <input type="text" id="taskname" name="TaskName" placeholder="enter task name">
        <br><br><br>

        <h4>Category: </h4>
        <label for="Work">Work</label>
        <input type="radio" id="Work" name="category" value="Work">
        <label for="personal">personal</label>
        <input type="radio" id="personal" name="category" value="personal">
        <label for="study">study</label>
        <input type="radio" id="study" name="category" value="study">
        <label for="shopping">shopping</label>
        <input type="radio" id="shopping" name="category" value="shopping">
        <br><br>


        <label for="prority">prority</label>
        <select name="prority" id="prority">
            <option value="High">High</option>
            <option value="High">medium</option>
            <option value="High">Low</option>
        </select>
        <br><br>

        <label for="duedate">Due Date</label>
        <input type="date" id="duedate" name="duedate">

        <br><br>

        <h2>Describtion</h2>
        <textarea id="describtion" name="describtion" rows="15" cols="50"
            placeholder="enter task describtion"></textarea>
        <br><br>
        <button>add task</button>
        <input type="submit"></input>








    </form>
</body>

</html>
